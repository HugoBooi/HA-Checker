<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cobblemon HA Shop & Checker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-red: #ef4444;
      --accent-gold: #f59e0b;
      --accent-green: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; min-height: 100vh; }
    header { text-align: center; margin-bottom: 15px; }
    header h1 { color: var(--accent-red); font-size: 2.2rem; margin-bottom: 5px; }
    header p { color: var(--text-muted); }

    #debugStatus { text-align: center; font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; }
    
    .manual-box {
      max-width: 500px; margin: 0 auto 20px auto; background: var(--card-bg);
      border: 1px dashed var(--accent-gold); padding: 12px; border-radius: 8px; text-align: center;
    }
    .manual-box input {
      width: 70%; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color);
      background: var(--bg-color); color: var(--text-main); font-size: 0.85rem;
    }
    .manual-box button {
      padding: 8px 12px; background: var(--accent-gold); color: black; font-weight: bold;
      border: none; border-radius: 6px; cursor: pointer;
    }

    .search-wrapper {
      max-width: 500px;
      margin: 0 auto 12px auto;
      position: relative;
    }
    .search-box { display: flex; gap: 8px; }
    input[type="text"] {
      width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color);
      background: var(--card-bg); color: var(--text-main); font-size: 1rem;
    }
    input:focus { outline: 2px solid var(--accent-red); }
    .btn { padding: 12px 20px; background-color: var(--accent-red); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn:hover { opacity: 0.9; }

    /* Custom Dropdown Overlay */
    .autocomplete-items {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 99;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-top: 4px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: none;
    }
    .autocomplete-item {
      padding: 8px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-main);
      font-size: 0.95rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background-color 0.15s ease;
    }
    .autocomplete-item:last-child {
      border-bottom: none;
    }
    .autocomplete-item:hover, .autocomplete-active {
      background-color: #334155;
      color: var(--accent-gold);
    }

    /* Sprite formatting within suggestions */
    .suggestion-sprite-container {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .suggestion-sprite {
      max-width: 36px;
      max-height: 36px;
      image-rendering: pixelated;
      object-fit: contain;
    }
    .suggestion-text {
      font-family: monospace;
      font-size: 0.95rem;
      flex-grow: 1;
    }

    .sheet-link-container { text-align: center; margin-bottom: 25px; }
    .sheet-btn {
      display: inline-block;
      padding: 8px 16px;
      background-color: var(--card-bg);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }
    .sheet-btn:hover {
      background-color: var(--accent-gold);
      color: #000;
    }

    .result-container { max-width: 500px; margin: 0 auto; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; text-align: center; }
    .card img { width: 110px; height: 110px; image-rendering: pixelated; }
    .card h2 { text-transform: capitalize; margin: 8px 0 4px 0; }
    
    .types-list { display: flex; justify-content: center; gap: 6px; margin: 8px 0 14px 0; }
    .type-badge { padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
    .type-grass { background: #78c850; color: #000; }
    .type-fire { background: #f08030; color: #fff; }
    .type-water { background: #6890f0; color: #fff; }
    .type-electric { background: #f8d030; color: #000; }
    .type-ice { background: #98d8d8; color: #000; }
    .type-fighting { background: #c03028; color: #fff; }
    .type-poison { background: #a040a0; color: #fff; }
    .type-ground { background: #e0c068; color: #000; }
    .type-flying { background: #a890f0; color: #fff; }
    .type-psychic { background: #f85888; color: #fff; }
    .type-bug { background: #a8b820; color: #000; }
    .type-rock { background: #b8a038; color: #fff; }
    .type-ghost { background: #705598; color: #fff; }
    .type-dragon { background: #7038f8; color: #fff; }
    .type-dark { background: #705848; color: #fff; }
    .type-steel { background: #b8b8d0; color: #000; }
    .type-fairy { background: #ee99ac; color: #000; }
    .type-normal { background: #a8a878; color: #000; }

    .status-badge { display: inline-block; padding: 8px 18px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; margin-top: 10px; }
    .owned { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .not-owned { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }

    .ability-box { background: #0f172a; padding: 10px; border-radius: 8px; margin: 12px 0; font-size: 0.95rem; }
    .ability-name { color: var(--accent-gold); font-weight: bold; text-transform: capitalize; }
    .no-ha { color: var(--text-muted); font-style: italic; }
    .loading { text-align: center; color: var(--text-muted); font-style: italic; }
  </style>

  <script>
    const CSV_LINK = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSOKm-ncx04X6arOfeV1MNW5Yzk5Yox1s38W7671moh3iIOwu5U49uC62svNn2v2NNPWZYy6FtxKbbA/pub?gid=0&single=true&output=csv';

    let ownedPokemonSet = new Set();
    let allPokeApiData = []; // Array of { name, id, url }
    let currentFocus = -1;

    // Fetch master list of Pokémon from PokéAPI including IDs for reliable sprites
    async function loadPokeApiList() {
      try {
        const res = await fetch('https://pokeapi.co/api/v2/pokemon?limit=2000');
        if (res.ok) {
          const data = await res.json();
          allPokeApiData = data.results.map(p => {
            // Extract Pokédex ID from URL: https://pokeapi.co/api/v2/pokemon/10001/
            const parts = p.url.split('/').filter(Boolean);
            const id = parts[parts.length - 1];
            return {
              name: p.name.toLowerCase().trim(),
              id: id
            };
          });
        }
      } catch (err) {
        console.warn('Could not pre-fetch PokéAPI name list for autocomplete:', err);
      }
    }

    function parseCSV(text) {
      if (!text || text.includes('<!DOCTYPE')) {
        throw new Error('Received non-CSV response');
      }

      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l);
      const set = new Set();
      
      for (let i = 0; i < lines.length; i++) {
        const cols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
        if (cols[0]) {
          const cleanName = cols[0].toLowerCase().trim().replace(/\s+/g, '-');
          if (cleanName && cleanName !== 'pokemon_name' && cleanName !== 'name' && cleanName !== 'pokemon') {
            set.add(cleanName);
          }
        }
      }
      return set;
    }

    function updateInventoryDisplay(set) {
      ownedPokemonSet = set;
      const debugBox = document.getElementById('debugStatus');
      const manualBox = document.getElementById('manualBox');

      if (debugBox) {
        debugBox.innerHTML = `<span style="color:var(--accent-green)">✓ Connected to Sheet! (${ownedPokemonSet.size} Pokémon Loaded)</span>`;
      }
      if (manualBox) manualBox.style.display = 'none';
    }

    async function loadInventory() {
      const debugBox = document.getElementById('debugStatus');
      const manualBox = document.getElementById('manualBox');

      try {
        const cacheBusterUrl = `${CSV_LINK}&t=${Date.now()}`;
        const res = await fetch(cacheBusterUrl);
        
        if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
        
        const text = await res.text();
        const set = parseCSV(text);
        
        if (set.size > 0) {
          updateInventoryDisplay(set);
          return;
        } else {
          throw new Error('Sheet returned 0 Pokémon');
        }

      } catch (err) {
        console.warn('Direct fetch failed, trying proxy fallback...', err);
        
        try {
          const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(CSV_LINK)}`;
          const res = await fetch(proxyUrl);
          const text = await res.text();
          const set = parseCSV(text);
          
          if (set.size > 0) {
            updateInventoryDisplay(set);
            return;
          }
        } catch (proxyErr) {
          console.error('All automated fetch attempts failed:', proxyErr);
          if (debugBox) {
            debugBox.innerHTML = `<span style="color:var(--accent-gold)">⚠️ Couldn't auto-fetch Google Sheet. Use manual paste below:</span>`;
          }
          if (manualBox) manualBox.style.display = 'block';
        }
      }
    }

    function processManualData() {
      const input = document.getElementById('manualCsvInput').value;
      const lines = input.split(/[\n,]+/).map(s => s.trim().toLowerCase().replace(/\s+/g, '-')).filter(s => s);
      const set = new Set();
      
      lines.forEach(item => {
        const clean = item.trim();
        if (clean && clean !== 'pokemon_name') {
          set.add(clean);
        }
      });

      if (set.size > 0) {
        updateInventoryDisplay(set);
      } else {
        alert('No valid Pokémon names found.');
      }
    }

    // Reliable multi-level sprite URL resolver for hyphenated names and form variants
    function getSpriteUrls(pokemonName, pokemonId = null) {
      const name = pokemonName.toLowerCase().trim();
      const urls = [];

      // 1. Primary: Showdown Animated/Static Sprites (handles multi-word hyphenated names like tapu-koko, iron-hands, etc.)
      let showdownName = name;
      if (name === 'nidoran-f') showdownName = 'nidoranf';
      else if (name === 'nidoran-m') showdownName = 'nidoranm';
      else if (name.startsWith('tapu-')) showdownName = name.replace('-', ''); // e.g. tapukoko
      else if (name.startsWith('iron-')) showdownName = name.replace('-', ''); // e.g. ironhands
      else if (name.startsWith('great-')) showdownName = name.replace('-', ''); // e.g. greattusk
      else if (name === 'darmanitan-galar-standard' || name === 'darmanitan-galar') showdownName = 'darmanitan-galar';
      else if (name === 'darmanitan-standard') showdownName = 'darmanitan';

      urls.push(`https://play.pokemonshowdown.com/sprites/gen5/${showdownName}.png`);
      urls.push(`https://play.pokemonshowdown.com/sprites/dex/${showdownName}.png`);

      // 2. Secondary: Direct PokéAPI raw sprite by numeric ID (if available from initial index fetch)
      if (pokemonId) {
        urls.push(`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemonId}.png`);
      }

      // 3. Fallback: PokéAPI GitHub sprite by raw hyphenated name
      urls.push(`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${showdownName}.png`);
      
      // 4. Default substitute substitute/pokeball fallback
      urls.push('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/0.png');

      return urls;
    }

    function handleAutocomplete(inputVal) {
      const listContainer = document.getElementById('autocompleteList');
      listContainer.innerHTML = '';
      currentFocus = -1;

      if (!inputVal || inputVal.trim() === '') {
        listContainer.style.display = 'none';
        return;
      }

      // Convert spaces into hyphens to strictly follow PokéAPI conventions
      const val = inputVal.toLowerCase().trim().replace(/\s+/g, '-');
      
      // Search in pre-fetched PokéAPI list or owned list
      const matchesMap = new Map();

      // Search PokéAPI objects first (so we have ID)
      for (const item of allPokeApiData) {
        if (item.name.startsWith(val)) {
          if (!matchesMap.has(item.name)) matchesMap.set(item.name, { name: item.name, id: item.id, rank: 1 });
        } else if (item.name.includes(val)) {
          if (!matchesMap.has(item.name)) matchesMap.set(item.name, { name: item.name, id: item.id, rank: 2 });
        }
      }

      // Also search owned stock names if not already present
      for (const ownedName of ownedPokemonSet) {
        if (ownedName.startsWith(val)) {
          if (!matchesMap.has(ownedName)) matchesMap.set(ownedName, { name: ownedName, id: null, rank: 1 });
        } else if (ownedName.includes(val)) {
          if (!matchesMap.has(ownedName)) matchesMap.set(ownedName, { name: ownedName, id: null, rank: 2 });
        }
      }

      // Sort: rank 1 (startsWith) before rank 2 (contains), max 5 results
      const matches = Array.from(matchesMap.values())
        .sort((a, b) => a.rank - b.rank || a.name.localeCompare(b.name))
        .slice(0, 5);

      if (matches.length === 0) {
        listContainer.style.display = 'none';
        return;
      }

      matches.forEach(item => {
        const div = document.createElement('div');
        div.className = 'autocomplete-item';

        const spriteUrls = getSpriteUrls(item.name, item.id);

        div.innerHTML = `
          <div class="suggestion-sprite-container">
            <img class="suggestion-sprite" 
                 src="${spriteUrls[0]}" 
                 data-url-index="0"
                 alt="${item.name}">
          </div>
          <span class="suggestion-text">${item.name}</span>
        `;

        // Handle sprite loading fallback across multiple backup sources
        const imgEl = div.querySelector('.suggestion-sprite');
        imgEl.onerror = function() {
          let currIndex = parseInt(this.getAttribute('data-url-index') || '0', 10);
          if (currIndex + 1 < spriteUrls.length) {
            currIndex++;
            this.setAttribute('data-url-index', currIndex);
            this.src = spriteUrls[currIndex];
          }
        };

        div.addEventListener('click', () => {
          document.getElementById('searchInput').value = item.name;
          listContainer.style.display = 'none';
          searchPokemon();
        });
        listContainer.appendChild(div);
      });

      listContainer.style.display = 'block';
    }

    function addActive(items) {
      if (!items) return false;
      removeActive(items);
      if (currentFocus >= items.length) currentFocus = 0;
      if (currentFocus < 0) currentFocus = (items.length - 1);
      items[currentFocus].classList.add('autocomplete-active');
    }

    function removeActive(items) {
      for (let i = 0; i < items.length; i++) {
        items[i].classList.remove('autocomplete-active');
      }
    }

    async function searchPokemon() {
      closeAutocomplete();
      let rawInput = document.getElementById('searchInput').value.toLowerCase().trim().replace(/\s+/g, '-');
      const container = document.getElementById('resultContainer');
      
      if (!rawInput) {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = '<p class="loading">Searching Pokémon database...</p>';

      const originalSearchInput = rawInput;

      const aliasMap = {
        'darmanitan-galar': 'darmanitan-galar-standard',
        'darmanitan-galaria': 'darmanitan-galar-standard',
        'darmanitan-galarian': 'darmanitan-galar-standard',
        'tauros-paldea': 'tauros-paldea-combat-breed',
        'meowth-galar': 'meowth-galar',
        'corsola-galar': 'corsola-galar'
      };

      if (aliasMap[rawInput]) {
        rawInput = aliasMap[rawInput];
      }

      try {
        let res = await fetch(`https://pokeapi.co/api/v2/pokemon/${rawInput}`);
        let data;

        if (!res.ok) {
          const baseSpeciesQuery = rawInput.split('-')[0];
          const speciesRes = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${baseSpeciesQuery}`);
          if (!speciesRes.ok) throw new Error('Not found');
          const speciesData = await speciesRes.json();
          
          const defaultVariety = speciesData.varieties.find(v => v.is_default) || speciesData.varieties[0];
          res = await fetch(defaultVariety.pokemon.url);
          data = await res.json();
        } else {
          data = await res.json();
        }

        const formName = data.name.toLowerCase();
        const types = data.types.map(t => t.type.name);

        const haObj = data.abilities.find(a => a.is_hidden);
        const hasHiddenAbility = Boolean(haObj);
        
        const formattedName = formName.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());

        const isOwned = ownedPokemonSet.has(formName) || 
                        ownedPokemonSet.has(originalSearchInput) ||
                        ownedPokemonSet.has(rawInput) ||
                        ownedPokemonSet.has(formName.replace(/-/g, ' '));

        const mainSpriteUrls = getSpriteUrls(formName, data.id);
        const defaultSprite = data.sprites.front_default || 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/0.png';

        container.innerHTML = `
          <div class="card">
            <img id="mainCardSprite" src="${mainSpriteUrls[0]}" data-url-index="0" alt="${formattedName}">
            <h2>${formattedName}</h2>
            
            <div class="types-list">
              ${types.map(t => `<span class="type-badge type-${t}">${t}</span>`).join('')}
            </div>

            <div class="ability-box">
              ${hasHiddenAbility ? `
                Hidden Ability: <span class="ability-name">${haObj.ability.name.replace(/-/g, ' ')}</span>
              ` : `
                <span class="no-ha">${formattedName} does not have a Hidden Ability</span>
              `}
            </div>

            ${hasHiddenAbility ? (
              isOwned ? `
                <div class="status-badge owned">
                  ✓ IN COLLECTION
                </div>
              ` : `
                <div class="status-badge not-owned">
                  ✗ NOT IN COLLECTION
                </div>
              `
            ) : ''}
          </div>
        `;

        const mainImg = document.getElementById('mainCardSprite');
        if (mainImg) {
          mainImg.onerror = function() {
            let currIndex = parseInt(this.getAttribute('data-url-index') || '0', 10);
            if (currIndex + 1 < mainSpriteUrls.length) {
              currIndex++;
              this.setAttribute('data-url-index', currIndex);
              this.src = mainSpriteUrls[currIndex];
            } else {
              this.src = defaultSprite;
            }
          };
        }

      } catch (err) {
        container.innerHTML = `<p style="text-align:center; color: var(--text-muted); margin-top: 15px;">No Pokémon found named "${originalSearchInput}". Check your spelling!</p>`;
      }
    }

    function closeAutocomplete() {
      const listContainer = document.getElementById('autocompleteList');
      if (listContainer) listContainer.style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('searchInput');

      document.getElementById('searchBtn').addEventListener('click', searchPokemon);
      
      searchInput.addEventListener('input', (e) => {
        handleAutocomplete(e.target.value);
      });

      searchInput.addEventListener('keydown', (e) => {
        const listContainer = document.getElementById('autocompleteList');
        let items = listContainer.getElementsByClassName('autocomplete-item');
        
        if (e.key === 'ArrowDown') {
          currentFocus++;
          addActive(items);
        } else if (e.key === 'ArrowUp') {
          currentFocus--;
          addActive(items);
        } else if (e.key === 'Enter') {
          if (currentFocus > -1 && items[currentFocus]) {
            e.preventDefault();
            items[currentFocus].click();
          } else {
            searchPokemon();
          }
        }
      });

      document.addEventListener('click', (e) => {
        if (e.target !== searchInput) {
          closeAutocomplete();
        }
      });

      loadPokeApiList();
      loadInventory();
    });
  </script>
</head>
<body>

  <header>
    <h1>🐒 Hugo's MirageCraft HA Collection</h1>
    <p>Search any pokemon to see whether Hugo owns it or not</p>
  </header>

  <div id="debugStatus">Connecting to Google Sheet...</div>

  <!-- Manual Input Backup Box -->
  <div class="manual-box" id="manualBox" style="display: none;">
    <p style="font-size: 0.85rem; margin-bottom: 8px;">Paste Pokémon List (e.g., <code>chimchar, monferno, infernape</code>):</p>
    <input type="text" id="manualCsvInput" placeholder="chimchar, darmanitan-galar">
    <button onclick="processManualData()">Set Inventory</button>
  </div>

  <div class="search-wrapper">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Type Pokémon name (e.g. infernape)..." autocomplete="off">
      <button class="btn" id="searchBtn">Search</button>
    </div>
    <div id="autocompleteList" class="autocomplete-items"></div>
  </div>

  <div class="sheet-link-container">
    <a href="https://docs.google.com/spreadsheets/d/1eqvIr1-JKXWFuQHFHlIq3gUlOjSN-Aajq9MesT0Sy20/edit?usp=sharing" target="_blank" class="sheet-btn">📋 Click if you want to scroll through the list</a>
  </div>

  <div class="result-container" id="resultContainer"></div>

</body>
</html>
